name: Release

# Publishing a GitHub release builds the Apple Silicon app and attaches it to
# that same release. The app version comes from the tag (via DEN_VERSION into
# scripts/bundle.sh), so there is nothing to bump. Pull requests run the same
# build and DMG packaging but upload nothing.

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to (e.g. v1.2.3)
        required: true
        type: string

# Uploading to the release needs write access; the built-in token is enough.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static Linux dend (x86_64, aarch64). Den downloads the one a host needs
  # from this release (releases/download/vX.Y.Z/dend-linux-<arch>) the first
  # time it connects, so the DMG stays small.
  build-dend-linux:
    name: dend Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out submodules
        run: git submodule update --init vendor/termy

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: vendor/termy

      - name: Build dend for Linux
        run: scripts/build-dend-linux.sh

      - name: Attach dend to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/linux/dend-linux-x86_64 dist/linux/dend-linux-aarch64 --clobber --repo "${{ github.repository }}"

  build-macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The app icon PNG is Git LFS; without it bundle.sh gets a pointer
          # file and sips fails the build.
          lfs: true

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the vX.Y.Z format, got $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      # Before the cache: restoring a submodule's target/ first leaves its
      # folder non-empty, and the clone into it fails.
      - name: Check out submodules
        run: git submodule update --init vendor/termy vendor/fsearch

      # libtermy_engine (vendor/termy) and fsearch (vendor/fsearch) are Rust.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/termy
            vendor/fsearch

      # Same as a local release build: the TermyEngine xcframework, then
      # Den.app. Version is stamped into the Info.plist before signing, so
      # the signature stays valid.
      # A stable (self-signed) identity keeps dend's macOS privacy grants
      # (Full Disk Access, Downloads…) across updates; an ad-hoc signature
      # changes every build, so macOS silently drops them. Without the
      # secret (pull requests from forks) the build stays ad-hoc.
      - name: Import signing certificate
        id: signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
        run: |
          if [[ -z "$SIGNING_CERT_P12" ]]; then
            echo "No SIGNING_CERT_P12 secret; signing ad-hoc." >&2
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=${SIGNING_IDENTITY:-Den Signing}" >> "$GITHUB_OUTPUT"

      - name: Build Den.app
        env:
          DEN_VERSION: ${{ steps.version.outputs.version }}
          DEN_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          DEN_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          scripts/bundle.sh release
          # Fails the build if dend didn't get the identity.
          codesign -dvv dist/Den.app/Contents/MacOS/dend 2>&1 | grep -E 'Authority|Signature'

      # The app is ad-hoc signed, not notarized. Gatekeeper treats it as
      # unsigned on other Macs (right-click > Open on first launch).
      # The DMG is named after its version; the website links to a fixed name.
      # It holds Den.app next to an Applications link to drag it onto.
      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -d dist/Den.app
          rm -rf dist/dmg && mkdir dist/dmg
          ditto dist/Den.app dist/dmg/Den.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Den" -srcfolder dist/dmg -ov -format UDZO "dist/Den-$VERSION-macos-arm64.dmg"
          cp "dist/Den-$VERSION-macos-arm64.dmg" dist/Den-macos-arm64.dmg

      - name: Attach DMG to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" "dist/Den-$VERSION-macos-arm64.dmg" dist/Den-macos-arm64.dmg --clobber --repo "${{ github.repository }}"

      # The updater's feed: one entry for this version, signed with the EdDSA
      # private key, served from this same release at
      # .../releases/latest/download/appcast.xml (the SUFeedURL in the app).
      # One-time setup: download a Sparkle release tarball, run its
      # bin/generate_keys, store the printed private key as the
      # SPARKLE_PRIVATE_KEY secret and the public key as the
      # SPARKLE_PUBLIC_KEY variable. The private key can't rotate later on
      # ad-hoc-signed builds, so keep it somewhere safe.
      - name: Sign update and attach appcast
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION=2.10.0
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle && tar xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          keyfile="$(mktemp)"; chmod 600 "$keyfile"; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$keyfile"
          mkdir -p dist/feed && cp "dist/Den-$VERSION-macos-arm64.dmg" dist/feed/
          /tmp/sparkle/bin/generate_appcast dist/feed \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            -o dist/appcast.xml --ed-key-file "$keyfile"
          rm -f "$keyfile" /tmp/sparkle.tar.xz; rm -rf /tmp/sparkle
          gh release upload "$TAG" dist/appcast.xml --clobber --repo "${{ github.repository }}"
