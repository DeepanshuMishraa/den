name: CI

# Builds Den.app on every push to main and every PR, with the same steps as
# the release, so a broken build shows up before a release tag points at it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: vendor/fsearch

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: .tools/zig
          key: zig-0.16.0-macos-arm64

      - name: Build Den.app
        run: |
          git submodule update --init vendor/ghostty vendor/fsearch
          scripts/bundle.sh release
          test -d dist/Den.app
